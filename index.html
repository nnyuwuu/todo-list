<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <button class="todo__theme-btn">   
            <img src="icons/moon.svg" alt="moon theme changer"
            width="36"
            height="36">
        </button>
        <header class="todo__header">
            <h1 class="todo__title">My tasks</h1>
        </header>
        <div class="todo__input-wrapper">
            <input type="text" class="todo__input" placeholder="Type your task here...">
            <button class="todo__add-btn">
                Add</button>
        </div>
        <main class="todo__main">
            <div class="todo__toolbar">
                <div class="todo__filters">
                    <button class="todo__filter todo__filter--active">All</button>
                    <button class="todo__filter">Active</button>
                    <button class="todo__filter">Completed</button>
                </div>
                <span class="todo__counter">0 tasks left</span>
            </div>
            <ul class="todo__list">
                <li class="todo__item">
                    <input type="checkbox" name="1" id="">
                    <span class="todo__item-text">Learn ReactJS</span>
                    <button class="todo__edit-btn">
                        <img src="icons/edit.svg" alt="edit task">
                    </button>
                    <button class="todo__delete-btn">
                        <img src="icons/delete.svg" alt="delete task">
                    </button>
                </li>
                <li class="todo__item">
                    <input type="checkbox" name="1" id="">
                    <span class="todo__item-text">Push to Github</span>
                    <button class="todo__edit-btn">
                        <img src="icons/edit.svg" alt="edit task">
                    </button>
                    <button class="todo__delete-btn">
                        <img src="icons/delete.svg" alt="delete task">
                    </button>
                </li>
            </ul>
        </main>
        <footer class="todo__footer">© 2025</footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
